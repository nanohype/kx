name: helm
description: >-
  Install the helm release every kx workflow renders with, pinned to one
  version and checked against its recorded digest before it reaches PATH.

# One place for the version every render runs on, so a render's verdict is a
# fact about the commit rather than about the day helm was installed.
#
# Downloaded to a file and checked against the digest get.helm.sh publishes
# before it reaches PATH. Renovate moves HELM_VERSION but not the digest, so a
# bump fails here until the digest is updated.
runs:
  using: composite
  steps:
    - name: Install helm
      shell: bash
      env:
        HELM_VERSION: v4.3.2
        HELM_SHA256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
      run: |
        archive="$RUNNER_TEMP/helm.tar.gz"
        curl -sSfL --max-time 120 --retry 3 --retry-connrefused --retry-all-errors \
          -o "$archive" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
        echo "${HELM_SHA256}  $archive" | sha256sum -c -
        tar -xz -C /usr/local/bin --strip-components=1 -f "$archive" linux-amd64/helm
        rm "$archive"
        helm version --short
