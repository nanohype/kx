name: chart provenance
# Asks whether the charts this stack pins are still the charts they were pinned
# for, upstream, right now.
#
# Separate from ci.yml for the same reason mirror freshness is. ci.yml checks
# that every pin has a record, which is a fact about the commit under test.
# Whether a maintainer deprecated a chart, or handed it to another organisation,
# has a different answer every day and is not something a pull request caused.
# Asking it on the blocking path reddens changes that are not at fault.
#
# It is also structurally impossible to put here: the merge gate refuses a
# workflow containing a job it does not watch, and counts a skipped dependency
# as a failure, so a schedule-only job cannot live in ci.yml.
#
# A red run here means: read the upstream notes for whatever it names, decide
# whether the chart is still the one you want, then either migrate the pin or
# `python3 scripts/check-chart-deprecation.py --sync` to re-record it.

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

# One run per ref. A push that lands on top of another leaves the first run
# grading a tree nobody is proposing any more, and its verdict arrives against
# the newer commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    name: Are the pinned charts still what they were?
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Fails on a `deprecated: true`, and on a chart whose description no longer
      # matches its record. The second is the one worth having: a chart can be
      # re-scoped to a different product, or forked away to a different
      # maintainer, without anyone setting the deprecated flag — and then the pin
      # keeps resolving while the thing behind it is no longer the same software.
      - name: Compare every pinned chart against its record
        run: |
          pip install --quiet --timeout 60 --retries 3 pyyaml==6.0.3
          python3 scripts/check-chart-deprecation.py --live
