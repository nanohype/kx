name: chart provenance
# Asks whether each chart this stack pins is still the chart it was pinned for,
# upstream, now. Scheduled rather than in ci.yml, because the answer changes
# without this repository changing (ADR 0011).
#
# A red run here means: read the upstream notes for whatever it names, decide
# whether the chart is still the one you want, then either migrate the pin or
# `python3 scripts/check-chart-deprecation.py --sync` to re-record it.

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

# One run per ref: a new run supersedes one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    name: Are the pinned charts still what they were?
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: ./.github/actions/helm

      # Fails on `deprecated: true`, and on a description that no longer matches
      # its record: a chart can change hands or products with the flag unset.
      - name: Compare every pinned chart against its record
        run: |
          pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/gate-requirements.txt
          python3 scripts/check-chart-deprecation.py --live
