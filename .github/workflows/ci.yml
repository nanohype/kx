name: ci

on:
  pull_request:
  push:
    branches: [main]

# One run per ref. A push that lands on top of another leaves the first run
# grading a tree nobody is proposing any more, and its verdict arrives against
# the newer commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job here only reads the tree. Declared explicitly rather than inherited:
# the org default is already `read`, but a default is a setting someone can change
# without touching this file, and the two sibling workflows declare it too.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, because the prose step diffs base...HEAD and a merge
          # base needs a common ancestor on BOTH sides. Deepening only the base
          # leaves the head shallow and the range still unresolvable — and the
          # gate refuses rather than reporting an empty diff, so getting this
          # wrong is a red job rather than a silent pass.
          fetch-depth: 0

      # Every Python tool this job runs, from one hash-locked file: each
      # package, transitive ones included, at one version and the hashes PyPI
      # publishes for it, so the job installs exactly those files or fails.
      # Pinned in the file rather than resolved here, because a resolver picks
      # by interpreter: an older python silently caps an install at the last
      # release that still supports it, so an unpinned install lets whichever
      # python runs it choose the scanner CI runs.
      - name: Install the lint tools
        run: pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/lint-requirements.txt

      - name: yamllint
        run: yamllint .

      # Grafana ships a default password and is published as a NodePort on a
      # mapped host port, so that credential is defensible only while the port
      # is loopback-bound — which its values file states. That makes the binding
      # a claim, and a claim needs an instrument: kind's listenAddress default is
      # 0.0.0.0, so a mapping added without it is exposed on every interface and
      # reads exactly like the ones above it.
      #
      # MinIO also ships a default credential but publishes nothing, so it rests
      # on a different argument its own values file makes. This check is about
      # the mappings, not about every default password in the tree.
      - name: host ports are loopback-bound
        run: |
          python3 - <<'PY'
          import sys, yaml
          doc = yaml.safe_load(open("cluster/kind-config.yaml"))
          maps = [(n.get("role","?"), m) for n in doc["nodes"] for m in n.get("extraPortMappings") or []]
          if not maps:
              sys.exit("no extraPortMappings found — this check would pass vacuously")
          bad = [f'{r}:{m["hostPort"]} -> {m.get("listenAddress", "0.0.0.0 (kind default)")}'
                 for r, m in maps if m.get("listenAddress") != "127.0.0.1"]
          if bad:
              sys.exit("host ports not bound to 127.0.0.1:\n  " + "\n  ".join(bad))
          print(f"ok  {len(maps)} host port(s) bound to 127.0.0.1")
          PY

      # Pinned and checked before it is unpacked onto PATH, the way kubeconform
      # is below, rather than taken from apt at whatever version the runner
      # image carries that week: a shellcheck release that adds a warning would
      # otherwise redden this job with no change here to point at. shellcheck
      # publishes no checksum file, so the digest was computed from the release
      # asset when the version was pinned, and it catches a replaced or
      # truncated asset from then on.
      #
      # `git ls-files` rather than a glob: a glob names one filename and silently
      # excludes every other shell file in the tree, which is the reduced-corpus
      # failure the gates in this repo assert against for their own inputs. An
      # exclusion here has to be a `shellcheck disable` line carrying a reason,
      # where the reader of the script sees it.
      - name: shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL --max-time 120 --retry 3 --retry-connrefused --retry-all-errors \
            -o shellcheck.tar.xz "$url"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJ -C /usr/local/bin --strip-components=1 -f shellcheck.tar.xz \
            "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          rm shellcheck.tar.xz
          shellcheck --version
          mapfile -t sh < <(git ls-files '*.sh')
          if [ "${#sh[@]}" -eq 0 ]; then
            echo "no shell files found — refusing to report a clean lint over nothing" >&2
            exit 1
          fi
          echo "linting ${#sh[@]} shell file(s)"
          shellcheck "${sh[@]}"

      # Every tracked Python file, not only the gates under scripts/: the helpers
      # an installer runs, which the test job executes and nothing else in CI
      # does, and the tests themselves. `git ls-files` for the reason the
      # shellcheck step gives, and an empty set refused.
      - name: ruff
        run: |
          mapfile -t py < <(git ls-files '*.py')
          if [ "${#py[@]}" -eq 0 ]; then
            echo "no Python files found — refusing to report a clean lint over nothing" >&2
            exit 1
          fi
          echo "linting ${#py[@]} Python file(s)"
          ruff check "${py[@]}"

      # The supply-chain scan, and it fails the build rather than warning. This
      # repository ships no package manifest, so its dependency surface is the
      # workflows themselves: the actions they call, the tokens they hold, and
      # every `${{ }}` that reaches a run block. A branch name is attacker-
      # controlled on a fork pull request, and an expansion is substituted into
      # shell source before bash parses it.
      - name: zizmor
        run: |
          # --no-online-audits keeps the verdict a function of the commit under
          # test, the same rule the mirror job states: the online audits ask
          # GitHub whether an action has since been archived, which is a fact
          # about the world on the day the job runs and would redden a pull
          # request that did not cause it. It is also an unbounded network call
          # inside a blocking gate.
          # --persona=auditor, not the default. The default persona does not
          # RUN the excessive-permissions audit at all, so a workflow-level
          # id-token: write — which every job added later silently inherits,
          # with no diff that looks like a permission change — is not merely
          # unreported, it is never looked for. A green tick from a check that
          # skipped the audit is worse than no check.
          # The local actions are scanned with the workflows that call them: a
          # composite action's run block executes with the calling job's token.
          zizmor --no-online-audits --persona=auditor .github/workflows/ .github/actions/

      # Advisory, and exits 0 whatever it finds. Prose conformance is read
      # rather than matched — a pattern finds only the phrasings its author
      # thought of — so this surfaces the prose a change adds next to the rules
      # instead of claiming a verdict over it. Needs the base commit to diff
      # against, which the checkout above fetches.
      - name: prose the change adds
        if: github.event_name == 'pull_request'
        env:
          # Through the environment, never interpolated into the run block: a
          # `${{ }}` expansion is substituted into the shell source before bash
          # parses it, so a branch named with a shell metacharacter would run.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The checkout above takes full history, so the base ref only needs
          # fetching; no deepening dance, and no silent empty range if it fails.
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          python3 scripts/check-prose-voice.py "origin/$BASE_REF"

  renovate-coverage:
    name: Every chart pin is watched
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every chart version in this repo is pinned inside an install.sh, because
      # explicit install scripts are the point here. Renovate ships no manager
      # that reads a shell script, so the pins are covered by customManagers in
      # renovate.json — and a customManager whose regex matches nothing is valid
      # config watching nothing. renovate-config-validator passes it: the schema
      # is fine and the pattern never runs against a file.
      - name: renovate customManagers cover every install.sh pin
        run: python3 scripts/check-renovate-coverage.py

  chart-provenance:
    name: Every chart pin is recorded
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Offline half only. Whether a chart went deprecated upstream overnight is
      # not a function of this commit, and gating merges on it would redden pull
      # requests that did not cause it — the same reason mirror freshness is
      # asked on a schedule. chart-provenance.yml asks the live question.
      #
      # What is checked here is that every pinned chart has a record and every
      # record still names a pinned chart, so the live half cannot quietly stop
      # covering something.
      - name: Every pin has a provenance record, and can fail
        run: |
          pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/gate-requirements.txt
          python3 scripts/check-chart-deprecation.py

  mirror:
    name: Mirror the eks-gitops catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # At the pinned ref, never at eks-gitops' default branch. The verdict has
      # to be a function of the commit under test — reading upstream's head
      # would turn this check red the moment Renovate merges a chart bump over
      # there, which is a fact about that repository and not about this PR.
      # `mirror-freshness.yml` asks that question on its own schedule.
      # Full history, because the ref to compare against lives in
      # stack/upstream.json and is read after the checkout, not before it.
      - name: Check out the catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nanohype/eks-gitops
          path: .sibling/eks-gitops
          fetch-depth: 0
          persist-credentials: false

      - name: Compare every chart pin against the catalog
        env:
          EKS_GITOPS_DIR: ${{ github.workspace }}/.sibling/eks-gitops
        run: |
          pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/gate-requirements.txt
          ref="$(python3 -c 'import json;print(json.load(open("stack/upstream.json"))["upstream"]["ref"])')"
          # Asserted before use. A substitution that produced nothing is not a
          # tree that pinned nothing, and `git checkout ""` is not a checkout of
          # the pin. Tested with a bash conditional rather than a match against
          # an external tool, so an absent tool cannot delete the assertion the
          # way it would delete a grep.
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FAIL  upstream.ref read as '$ref', which is not a commit sha."
            echo "      Comparing against an unresolved ref would grade the catalog at whatever"
            echo "      the checkout happened to be on."
            exit 1
          fi
          git -C "$EKS_GITOPS_DIR" checkout -q "$ref"
          python3 scripts/mirror-check.py check

  render:
    name: Render every helm slice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The operator slice installs the sibling eks-agent-platform checkout's
      # chart against kx's values — give it one to render from.
      #
      # At the ref stack/upstream.json records, for the reason the mirror job
      # states: reading that repository's default branch makes this job's
      # verdict a fact about a commit nobody here proposed, so a merge there
      # reddens a pull request that did not cause it.
      - name: Read the sibling ref
        id: sibling
        run: |
          ref="$(python3 -c 'import json;print(json.load(open("stack/upstream.json"))["siblings"]["eks-agent-platform"]["ref"])')"
          # Asserted before it becomes a step output. An empty value here is not
          # an error to actions/checkout — it is the instruction to take the
          # DEFAULT BRANCH, which is exactly the reading the comment above says
          # this job must not do. The failure is silent and the render still
          # passes, against a commit nobody here proposed.
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FAIL  siblings.eks-agent-platform.ref read as '$ref', which is not a commit sha."
            echo "      An empty ref makes the checkout take the sibling's default branch, so this"
            echo "      job would render against a commit this change did not pin."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nanohype/eks-agent-platform
          path: .sibling/eks-agent-platform
          ref: ${{ steps.sibling.outputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/helm

      - uses: ./.github/actions/kubeconform

      # Every gate this job runs proves it can still reject before the stack is
      # validated, so a gate that has stopped rejecting fails here rather than
      # reporting a green stack it never checked.
      # The producer, proven before the consumer. render-check.sh feeds the schema
      # gate its input, so an extraction that quietly lifted the wrong command
      # would hand that gate a clean verdict over something the installer never
      # runs — a tested consumer over an unproven producer.
      # Invariants about the tree, each closing a class found once and fixed
      # everywhere — among them an unbounded helm install, a manifest in an
      # addon directory that nothing applies, a Python program hidden in a shell
      # string, a Python file that does not compile, and a gate that can no
      # longer reject. The script lists them all, and runs its own positive
      # controls before reporting, so there is no separate step to forget.
      #
      # In this job because one invariant RUNS every gate in the suite and
      # observes what it does, rather than reading its source for the word
      # "control" — and the schema gate's controls need kubeconform, installed
      # above. A floor that cannot observe a gate refuses to certify it, so this
      # has to run where every gate can run.
      - name: Slice invariants hold, and every gate still rejects
        run: |
          pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/gate-requirements.txt
          python3 scripts/check-slice-integrity.py

      - name: helm template each slice at its pinned version
        env:
          KX_EKS_AGENT_PLATFORM_DIR: ${{ github.workspace }}/.sibling/eks-agent-platform
          KX_RENDER_OUT: ${{ runner.temp }}/render
        run: ./scripts/render-check.sh

      # Same render, second pass. A custom resource in one slice is defined by a
      # CRD shipped in another, so nothing can be validated until every slice has
      # rendered — which is why this is a step here rather than its own job.
      # Every gate below runs its own positive controls before it reports, so a
      # gate that has stopped rejecting fails on its own invocation rather than
      # in a step somebody has to remember to add.
      # Whether an image reference is immutable IS a fact about the commit under
      # test, and so is whether a tag a values file pins by hand names the same
      # release as the chart's own images, so this half blocks. The CVE half asks
      # a question with a different answer every day and runs on a schedule, in
      # image-cves.yml — the same split, for the same reason, as chart provenance
      # and mirror freshness.
      #
      # kx pins its own chart versions and those pins are not derived from the
      # catalog, so no other repository can vouch for what they resolve to. The
      # render is the input rather than the values files, because a values file
      # names the deltas and the chart supplies the rest.
      - name: Every image the pinned charts resolve to is immutable, every hand pin on its chart's release
        env:
          RENDER_DIR: ${{ runner.temp }}/render
        run: python3 scripts/check-images.py --pins "$RENDER_DIR"

      - name: Validate every rendered resource against a schema
        env:
          RENDER_DIR: ${{ runner.temp }}/render
        run: |
          pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/gate-requirements.txt
          python3 scripts/check-rendered-schemas.py "$RENDER_DIR"

      # Third pass over the same render, and the only one that joins it to the
      # sibling checkout the render was produced from. The operator slice hands
      # the binary flags through the chart's `extraArgs`, which the chart
      # declares as an untyped array and renders verbatim — so helm has nothing
      # to hold them to, and neither does anything above.
      #
      # Blocking, and it needs no schedule to be. Both of its subjects are in
      # the commit under test: this slice's values file, and the ref that
      # decides which checkout the flags are read from. Nothing here reads any
      # repository's default branch, so no merge elsewhere can redden a pull
      # request that did not cause it.
      #
      # Both paths arrive as arguments rather than through the environment. The
      # suite floor runs a probed gate with the ambient environment inherited,
      # so a checkout resolved from KX_EKS_AGENT_PLATFORM_DIR would be read from
      # a developer's own tree instead of the fixture the floor wrote.
      - name: Every flag the operator slice sets reaches a binary that defines it
        env:
          RENDER_DIR: ${{ runner.temp }}/render
          SIBLING_DIR: ${{ github.workspace }}/.sibling/eks-agent-platform
        run: python3 scripts/check-operator-flags.py --render "$RENDER_DIR" --chart-source "$SIBLING_DIR"

  kyverno:
    name: Kyverno policies behave as specified
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The suite runs twice, under two engines, and both are blocking.
      #
      # First, the Kyverno the security slice installs. Its release is read out
      # of stack/security/kyverno/values.yaml, where the readiness-checker tags
      # are held to the chart's own release by check-images.py, so this run
      # moves with the chart pin and cannot quietly test a different engine from
      # the one a workstation gets. Its digest comes from the checksums file the
      # same release publishes: that catches a truncated or substituted archive,
      # not a compromised release, which is the guarantee the kubeconform
      # download gives too.
      #
      # Then the release pinned here, which is the one the policies were written
      # against and the one the next chart bump installs. Renovate watches this
      # pin; the first run needs no watching because it follows the chart.
      #
      # Downloaded to a file and checked before it is unpacked and run, with the
      # retry set .github/actions/kubeconform explains.
      - name: Under the engine the security slice pins
        run: |
          ver="$(sed -n '/^webhooksCleanup:/,/^[^ ]/ s/^    tag: *\(v[0-9][^ ]*\)$/\1/p' stack/security/kyverno/values.yaml)"
          if [[ ! "$ver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FAIL  read the security slice's Kyverno release as '$ver', which is not a version."
            echo "      Testing against an unresolved release would grade the policies under"
            echo "      whatever engine the download happened to name."
            exit 1
          fi
          dir="$RUNNER_TEMP/kyverno-$ver"
          mkdir -p "$dir"
          base="https://github.com/kyverno/kyverno/releases/download/$ver"
          asset="kyverno-cli_${ver}_linux_x86_64.tar.gz"
          curl -sSfL --max-time 120 --retry 3 --retry-connrefused --retry-all-errors \
            -o "$dir/$asset" "$base/$asset"
          curl -sSfL --max-time 60 --retry 3 --retry-connrefused --retry-all-errors \
            -o "$dir/checksums.txt" "$base/checksums.txt"
          sum="$(awk -v a="$asset" '$2 == a {print $1}' "$dir/checksums.txt")"
          if [[ ! "$sum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "FAIL  $ver's checksums.txt carries no digest for $asset."
            exit 1
          fi
          (cd "$dir" && echo "$sum  $asset" | sha256sum -c -)
          tar -xz -C "$dir" -f "$dir/$asset" kyverno
          PATH="$dir:$PATH" ./scripts/kyverno-test.sh

      - name: Under the release the policies target
        env:
          KYVERNO_VERSION: v1.20.0
          KYVERNO_SHA256: 06b8f3ca7b5626473be8fb4d343ad54ab84e317142766f72420e7d44b80942e2
        run: |
          dir="$RUNNER_TEMP/kyverno-$KYVERNO_VERSION"
          mkdir -p "$dir"
          asset="kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          url="https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/$asset"
          curl -sSfL --max-time 120 --retry 3 --retry-connrefused --retry-all-errors \
            -o "$dir/$asset" "$url"
          (cd "$dir" && echo "${KYVERNO_SHA256}  $asset" | sha256sum -c -)
          tar -xz -C "$dir" -f "$dir/$asset" kyverno
          PATH="$dir:$PATH" ./scripts/kyverno-test.sh

  test:
    name: Python tests hold their coverage floors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # From one hash-locked file: every package, transitive ones included, at
      # one version and the hashes PyPI publishes for it, so the job installs
      # exactly those files or fails.
      - name: Install the test tools
        run: pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/test-requirements.txt

      # The schema gate's self-test runs kubeconform, at the release the render
      # job validates with.
      - uses: ./.github/actions/kubeconform

      # The helpers an installer runs are executed here and nowhere else in CI,
      # so their tests are the only thing that runs them before a workstation
      # does. The script holds the run to the floors pyproject.toml states: every
      # line and branch of each helper, and the gates together at a ratchet that
      # never sits under the minimums recorded beside it.
      - name: Every installer helper fully covered, every gate at its floor
        run: ./scripts/python-test.sh

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      [
        lint,
        renovate-coverage,
        chart-provenance,
        mirror,
        render,
        kyverno,
        test,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@9911d2952b1f9078816c323baa253a63242c1c31 # v1
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
