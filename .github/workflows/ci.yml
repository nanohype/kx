name: ci

on:
  pull_request:
  push:
    branches: [main]

# Every job here only reads the tree. Declared explicitly rather than inherited:
# the org default is already `read`, but a default is a setting someone can change
# without touching this file, and the two sibling workflows declare it too.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: yamllint
        run: |
          pip install --quiet --timeout 60 --retries 3 yamllint==1.37.1
          yamllint .

      # The MinIO and Grafana default credentials are defensible only while these
      # ports are loopback-bound, and both values files say so. That makes the
      # binding a claim, and a claim needs an instrument: kind's listenAddress
      # default is 0.0.0.0, so a mapping added without it is exposed on every
      # interface and reads exactly like the ones above it.
      - name: host ports are loopback-bound
        run: |
          python3 - <<'PY'
          import sys, yaml
          doc = yaml.safe_load(open("cluster/kind-config.yaml"))
          maps = [(n.get("role","?"), m) for n in doc["nodes"] for m in n.get("extraPortMappings") or []]
          if not maps:
              sys.exit("no extraPortMappings found — this check would pass vacuously")
          bad = [f'{r}:{m["hostPort"]} -> {m.get("listenAddress", "0.0.0.0 (kind default)")}'
                 for r, m in maps if m.get("listenAddress") != "127.0.0.1"]
          if bad:
              sys.exit("host ports not bound to 127.0.0.1:\n  " + "\n  ".join(bad))
          print(f"ok  {len(maps)} host port(s) bound to 127.0.0.1")
          PY

      # `git ls-files` rather than a glob: a glob names one filename and silently
      # excludes every other shell file in the tree, which is the reduced-corpus
      # failure the gates in this repo assert against for their own inputs. An
      # exclusion here has to be a `shellcheck disable` line carrying a reason,
      # where the reader of the script sees it.
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck >/dev/null
          mapfile -t sh < <(git ls-files '*.sh')
          if [ "${#sh[@]}" -eq 0 ]; then
            echo "no shell files found — refusing to report a clean lint over nothing" >&2
            exit 1
          fi
          echo "linting ${#sh[@]} shell file(s)"
          shellcheck "${sh[@]}"

      # The gate scripts are a third of this repo's code and nothing linted them.
      - name: ruff
        run: |
          pip install --quiet --timeout 60 --retries 3 ruff==0.16.4
          ruff check scripts/

      # Advisory, and exits 0 whatever it finds. Prose conformance is read
      # rather than matched — a pattern finds only the phrasings its author
      # thought of — so this surfaces the prose a change adds next to the rules
      # instead of claiming a verdict over it. Needs the base commit to diff
      # against, which the default shallow checkout does not fetch.
      # The supply-chain scan, and it fails the build rather than warning. This
      # repository ships no package manifest, so its dependency surface is the
      # workflows themselves: the actions they call, the tokens they hold, and
      # every `${{ }}` that reaches a run block. A branch name is attacker-
      # controlled on a fork pull request, and an expansion is substituted into
      # shell source before bash parses it.
      - name: zizmor
        run: |
          pip install --quiet --timeout 60 --retries 3 zizmor==1.16.3
          # --no-online-audits keeps the verdict a function of the commit under
          # test, the same rule the mirror job states: the online audits ask
          # GitHub whether an action has since been archived, which is a fact
          # about the world on the day the job runs and would redden a pull
          # request that did not cause it. It is also an unbounded network call
          # inside a blocking gate.
          zizmor --no-online-audits --persona=regular .github/workflows/

      - name: prose the change adds
        if: github.event_name == 'pull_request'
        env:
          # Through the environment, never interpolated into the run block: a
          # `${{ }}` expansion is substituted into the shell source before bash
          # parses it, so a branch named with a shell metacharacter would run.
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python3 scripts/check-prose-voice.py "origin/$BASE_REF"

  renovate-coverage:
    name: Every chart pin is watched
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every chart version in this repo is pinned inside an install.sh, because
      # explicit install scripts are the point here. Renovate ships no manager
      # that reads a shell script, so the pins are covered by customManagers in
      # renovate.json — and a customManager whose regex matches nothing is valid
      # config watching nothing. renovate-config-validator passes it: the schema
      # is fine and the pattern never runs against a file.
      - name: renovate customManagers cover every install.sh pin
        run: python3 scripts/check-renovate-coverage.py

  chart-provenance:
    name: Every chart pin is recorded
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Offline half only. Whether a chart went deprecated upstream overnight is
      # not a function of this commit, and gating merges on it would redden pull
      # requests that did not cause it — the same reason mirror freshness is
      # asked on a schedule. chart-provenance.yml asks the live question.
      #
      # What is checked here is that every pinned chart has a record and every
      # record still names a pinned chart, so the live half cannot quietly stop
      # covering something.
      - name: Every pin has a provenance record, and can fail
        run: |
          pip install --quiet --timeout 60 --retries 3 pyyaml==6.0.3
          python3 scripts/check-chart-deprecation.py

  mirror:
    name: Mirror the eks-gitops catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # At the pinned ref, never at eks-gitops' default branch. The verdict has
      # to be a function of the commit under test — reading upstream's head
      # would turn this check red the moment Renovate merges a chart bump over
      # there, which is a fact about that repository and not about this PR.
      # `mirror-freshness.yml` asks that question on its own schedule.
      # Full history, because the ref to compare against lives in
      # stack/upstream.json and is read after the checkout, not before it.
      - name: Check out the catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nanohype/eks-gitops
          path: .sibling/eks-gitops
          fetch-depth: 0
          persist-credentials: false

      - name: Compare every chart pin against the catalog
        env:
          EKS_GITOPS_DIR: ${{ github.workspace }}/.sibling/eks-gitops
        run: |
          pip install --quiet --timeout 60 --retries 3 pyyaml==6.0.3
          ref="$(python3 -c 'import json;print(json.load(open("stack/upstream.json"))["upstream"]["ref"])')"
          git -C "$EKS_GITOPS_DIR" checkout -q "$ref"
          python3 scripts/mirror-check.py check

  render:
    name: Render every helm slice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The operator slice installs the sibling eks-agent-platform checkout's
      # chart against kx's values — give it one to render from.
      #
      # At the ref stack/upstream.json records, for the reason the mirror job
      # states: reading that repository's default branch makes this job's
      # verdict a fact about a commit nobody here proposed, so a merge there
      # reddens a pull request that did not cause it.
      - name: Read the sibling ref
        id: sibling
        run: |
          ref="$(python3 -c 'import json;print(json.load(open("stack/upstream.json"))["siblings"]["eks-agent-platform"]["ref"])')"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nanohype/eks-agent-platform
          path: .sibling/eks-agent-platform
          ref: ${{ steps.sibling.outputs.ref }}
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Downloaded to a file and checked before it is unpacked onto PATH and run.
      # Piping the response straight into tar executes whatever arrives: a
      # truncated transfer, a proxy error page, or a replaced asset all reach
      # the next step as a binary. The digest is the one the release publishes
      # alongside the archive, so it catches corruption and substitution of the
      # asset; it does not attest the release itself, which would need the
      # upstream signing key.
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          url="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -sSfL --max-time 120 --retry 3 --retry-connrefused -o kubeconform.tar.gz "$url"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f kubeconform.tar.gz kubeconform
          rm kubeconform.tar.gz
          kubeconform -v

      # Every gate this job runs proves it can still reject before the stack is
      # validated, so a gate that has stopped rejecting fails here rather than
      # reporting a green stack it never checked.
      # The producer, proven before the consumer. render-check.sh feeds the schema
      # gate its input, so an extraction that quietly lifted the wrong command
      # would hand that gate a clean verdict over something the installer never
      # runs — a tested consumer over an unproven producer.
      # Three invariants, each closing a class the sweep found once and fixed
      # everywhere: an unbounded helm install, a manifest in an addon directory
      # that nothing applies, and a gate that can no longer reject. It runs its
      # own positive controls before reporting, so there is no separate step to
      # forget.
      #
      # In this job because the third invariant RUNS every gate in the suite and
      # observes what it does, rather than reading its source for the word
      # "control" — and the schema gate's controls need kubeconform, installed
      # above. A floor that cannot observe a gate refuses to certify it, so this
      # has to run where every gate can run.
      - name: Slice invariants hold, and every gate still rejects
        run: |
          pip install --quiet --timeout 60 --retries 3 pyyaml==6.0.3
          python3 scripts/check-slice-integrity.py

      - name: helm template each slice at its pinned version
        env:
          KX_EKS_AGENT_PLATFORM_DIR: ${{ github.workspace }}/.sibling/eks-agent-platform
          KX_RENDER_OUT: ${{ runner.temp }}/render
        run: ./scripts/render-check.sh

      # Same render, second pass. A custom resource in one slice is defined by a
      # CRD shipped in another, so nothing can be validated until every slice has
      # rendered — which is why this is a step here rather than its own job.
      # Every gate below runs its own positive controls before it reports, so a
      # gate that has stopped rejecting fails on its own invocation rather than
      # in a step somebody has to remember to add.
      - name: Validate every rendered resource against a schema
        run: |
          pip install --quiet --timeout 60 --retries 3 pyyaml==6.0.3
          python3 scripts/check-rendered-schemas.py "${{ runner.temp }}/render"

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      [
        lint,
        renovate-coverage,
        chart-provenance,
        mirror,
        render,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
