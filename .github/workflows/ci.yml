name: ci

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a newer push supersedes the run grading the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the tree. Declared rather than inherited, because the
# organization's default can change without a diff here.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the prose step diffs base...HEAD, which needs the merge
          # base on both sides.
          fetch-depth: 0

      # Hash-locked: every package, transitive ones included, at one version and
      # its published hashes, so the job installs exactly those files or fails.
      - name: Install the lint tools
        run: pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/lint-requirements.txt

      - name: yamllint
        run: yamllint .

      # Pinned rather than apt's, so a new shellcheck cannot redden the job with
      # no change here. It publishes no checksum file, so the digest was computed
      # from the release asset when the version was pinned. `git ls-files` rather
      # than a glob, so no shell file goes unlinted; an exclusion is a
      # `shellcheck disable` line with its reason beside it.
      - name: shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL --max-time 120 --retry 3 --retry-connrefused --retry-all-errors \
            -o shellcheck.tar.xz "$url"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJ -C /usr/local/bin --strip-components=1 -f shellcheck.tar.xz \
            "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          rm shellcheck.tar.xz
          shellcheck --version
          mapfile -t sh < <(git ls-files '*.sh')
          if [ "${#sh[@]}" -eq 0 ]; then
            echo "no shell files found — refusing to report a clean lint over nothing" >&2
            exit 1
          fi
          echo "linting ${#sh[@]} shell file(s)"
          shellcheck "${sh[@]}"

      # Every tracked Python file: the gates, the installers' helpers and the
      # tests.
      - name: ruff
        run: |
          mapfile -t py < <(git ls-files '*.py')
          if [ "${#py[@]}" -eq 0 ]; then
            echo "no Python files found — refusing to report a clean lint over nothing" >&2
            exit 1
          fi
          echo "linting ${#py[@]} Python file(s)"
          ruff check "${py[@]}"

      # The supply-chain scan, and it fails the build. With no package manifest,
      # the workflows and actions are this repository's dependency surface.
      - name: zizmor
        run: |
          # --no-online-audits: the online audits ask about the world, not the
          # commit, over an unbounded call. --persona=auditor: the default
          # persona skips the excessive-permissions audit. The local actions
          # too, since their run blocks hold the calling job's token.
          zizmor --no-online-audits --persona=auditor .github/workflows/ .github/actions/

      # Advisory, and exits 0 whatever it finds: it lists the prose a change adds
      # beside the rules, for a reader, rather than claiming a verdict over it.
      - name: prose the change adds
        if: github.event_name == 'pull_request'
        env:
          # Through the environment: an expression in the run block would be
          # substituted into the script before bash parses it.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The checkout has full history, so the base ref only needs fetching.
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          python3 scripts/check-prose-voice.py "origin/$BASE_REF"

  renovate-coverage:
    name: Every chart pin is watched
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Renovate reads no shell script, so customManagers watch the install.sh
      # pins, and a customManager whose regex matches nothing is valid config
      # watching nothing.
      - name: renovate customManagers cover every install.sh pin
        run: python3 scripts/check-renovate-coverage.py

  chart-provenance:
    name: Every chart pin is recorded
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The offline half: every pin has a record, and every record a pin, so the
      # live half that chart-provenance.yml runs on a schedule covers every pin
      # (ADR 0011).
      - name: Every pin has a provenance record, and can fail
        run: |
          pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/gate-requirements.txt
          python3 scripts/check-chart-deprecation.py

  mirror:
    name: Mirror the eks-gitops catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # At the ref stack/upstream.json records, never the catalog's default
      # branch (ADR 0011). Full history, because that ref is read after the
      # checkout.
      - name: Check out the catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nanohype/eks-gitops
          path: .sibling/eks-gitops
          fetch-depth: 0
          persist-credentials: false

      - name: Compare every chart pin against the catalog
        env:
          EKS_GITOPS_DIR: ${{ github.workspace }}/.sibling/eks-gitops
        run: |
          pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/gate-requirements.txt
          ref="$(jq -r '.upstream.ref' stack/upstream.json)"
          # Asserted before use, with a bash conditional rather than an external
          # tool: an empty substitution is not a pin.
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FAIL  upstream.ref read as '$ref', which is not a commit sha."
            echo "      Comparing against an unresolved ref would grade the catalog at whatever"
            echo "      the checkout happened to be on."
            exit 1
          fi
          git -C "$EKS_GITOPS_DIR" checkout -q "$ref"
          python3 scripts/mirror-check.py check

  render:
    name: Render every helm slice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The operator slice renders the sibling eks-agent-platform chart, read at
      # the ref stack/upstream.json records (ADR 0011).
      - name: Read the sibling ref
        id: sibling
        run: |
          ref="$(jq -r '.siblings["eks-agent-platform"].ref' stack/upstream.json)"
          # Asserted before it becomes an output: actions/checkout reads an empty
          # ref as the default branch.
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FAIL  siblings.eks-agent-platform.ref read as '$ref', which is not a commit sha."
            echo "      An empty ref makes the checkout take the sibling's default branch, so this"
            echo "      job would render against a commit this change did not pin."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nanohype/eks-agent-platform
          path: .sibling/eks-agent-platform
          ref: ${{ steps.sibling.outputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/helm

      - uses: ./.github/actions/kubeconform

      # The floor first, so every gate below, render-check.sh among them, has
      # been seen to reject before its verdict is read (ADR 0014).
      - name: Slice invariants hold, and every gate still rejects
        run: |
          pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/gate-requirements.txt
          python3 scripts/check-slice-integrity.py

      - name: helm template each slice at its pinned version
        env:
          KX_EKS_AGENT_PLATFORM_DIR: ${{ github.workspace }}/.sibling/eks-agent-platform
          KX_RENDER_OUT: ${{ runner.temp }}/render
        run: ./scripts/render-check.sh

      # Over the same render, so a step rather than a job: a custom resource in
      # one slice is defined by a CRD another ships. Whether each image reference
      # is immutable is a fact about the commit; the CVE half runs on a schedule
      # in image-cves.yml (ADR 0011). The render is the input, since a
      # values file names only the deltas.
      - name: Every image the pinned charts resolve to is immutable, every hand pin on its chart's release
        env:
          RENDER_DIR: ${{ runner.temp }}/render
        run: python3 scripts/check-images.py --pins "$RENDER_DIR"

      - name: Validate every rendered resource against a schema
        env:
          RENDER_DIR: ${{ runner.temp }}/render
        run: |
          pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/gate-requirements.txt
          python3 scripts/check-rendered-schemas.py "$RENDER_DIR"

      # The chart hands the operator its flags through an untyped `extraArgs`
      # array, so nothing above holds them to the binary. Both paths come as
      # arguments: the floor runs a probed gate in the ambient environment, where
      # KX_EKS_AGENT_PLATFORM_DIR would name a developer's own checkout.
      - name: Every flag the operator slice sets reaches a binary that defines it
        env:
          RENDER_DIR: ${{ runner.temp }}/render
          SIBLING_DIR: ${{ github.workspace }}/.sibling/eks-agent-platform
        run: python3 scripts/check-operator-flags.py --render "$RENDER_DIR" --chart-source "$SIBLING_DIR"

  kyverno:
    name: Kyverno policies behave as specified
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Twice, both blocking. First under the release the security slice
      # installs, read from its values, where check-images.py holds the tag to
      # the chart's release, so this run moves with the chart pin. Then under the
      # release pinned below, which the policies target and Renovate watches.
      # Each archive is checked against its digest before it runs, with the
      # retry set .github/actions/kubeconform explains.
      - name: Under the engine the security slice pins
        run: |
          ver="$(sed -n '/^webhooksCleanup:/,/^[^ ]/ s/^    tag: *\(v[0-9][^ ]*\)$/\1/p' stack/security/kyverno/values.yaml)"
          if [[ ! "$ver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FAIL  read the security slice's Kyverno release as '$ver', which is not a version."
            echo "      Testing against an unresolved release would grade the policies under"
            echo "      whatever engine the download happened to name."
            exit 1
          fi
          dir="$RUNNER_TEMP/kyverno-$ver"
          mkdir -p "$dir"
          base="https://github.com/kyverno/kyverno/releases/download/$ver"
          asset="kyverno-cli_${ver}_linux_x86_64.tar.gz"
          curl -sSfL --max-time 120 --retry 3 --retry-connrefused --retry-all-errors \
            -o "$dir/$asset" "$base/$asset"
          curl -sSfL --max-time 60 --retry 3 --retry-connrefused --retry-all-errors \
            -o "$dir/checksums.txt" "$base/checksums.txt"
          sum="$(awk -v a="$asset" '$2 == a {print $1}' "$dir/checksums.txt")"
          if [[ ! "$sum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "FAIL  $ver's checksums.txt carries no digest for $asset."
            exit 1
          fi
          (cd "$dir" && echo "$sum  $asset" | sha256sum -c -)
          tar -xz -C "$dir" -f "$dir/$asset" kyverno
          PATH="$dir:$PATH" ./scripts/kyverno-test.sh

      - name: Under the release the policies target
        env:
          KYVERNO_VERSION: v1.20.0
          KYVERNO_SHA256: 06b8f3ca7b5626473be8fb4d343ad54ab84e317142766f72420e7d44b80942e2
        run: |
          dir="$RUNNER_TEMP/kyverno-$KYVERNO_VERSION"
          mkdir -p "$dir"
          asset="kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          url="https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/$asset"
          curl -sSfL --max-time 120 --retry 3 --retry-connrefused --retry-all-errors \
            -o "$dir/$asset" "$url"
          (cd "$dir" && echo "${KYVERNO_SHA256}  $asset" | sha256sum -c -)
          tar -xz -C "$dir" -f "$dir/$asset" kyverno
          PATH="$dir:$PATH" ./scripts/kyverno-test.sh

  test:
    name: Python tests hold their coverage floors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hash-locked, like the lint job's tools.
      - name: Install the test tools
        run: pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/test-requirements.txt

      # The schema gate's self-test runs kubeconform, at the release the render
      # job validates with.
      - uses: ./.github/actions/kubeconform

      # The installers' helpers run here and nowhere else in CI, under the floors
      # pyproject.toml states.
      - name: Every installer helper fully covered, every gate at its floor
        run: ./scripts/python-test.sh

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      [
        lint,
        renovate-coverage,
        chart-provenance,
        mirror,
        render,
        kyverno,
        test,
      ]
    # always(): without it a failed dependency skips this job, and branch
    # protection counts a skipped check as passing. Pull requests only, since
    # merges come from them; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@9911d2952b1f9078816c323baa253a63242c1c31 # v1
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
