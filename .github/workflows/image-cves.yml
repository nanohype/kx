name: image cves
# Scans the images kx's pinned charts resolve to, and fails on a CRITICAL no
# exception covers. kx's pins are its own, so no other repository vouches for
# what they resolve to. Scheduled rather than in ci.yml, which holds the half
# that is a fact about the commit: every image reference immutable
# (ADR 0011). Runtime scanning in the cluster is the trivy-operator addon's.
#
# A run ends clean, with findings, or unable to run, each with its own exit
# status, and the job summary names which (ADR 0013). On findings, move
# the chart pin where the publisher has rebuilt on a patched base, declaring
# the divergence in stack/upstream.json when that moves ahead of the catalog;
# otherwise record a time-boxed exception in stack/image-cve-exceptions.json.
# A red run opens one tracking issue, or comments on the open one, and a
# person closes it once the finding is dealt with.

on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

# One run per ref: a new run supersedes one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Are the pinned charts' images free of CRITICAL?
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write  # opens or comments on the tracking issue when the run is red
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The operator slice renders the sibling eks-agent-platform chart, read at
      # the ref stack/upstream.json records, so the scan covers the images kx
      # pins. Whether that branch has moved on is sibling-freshness.yml's question.
      - name: Read the sibling ref
        id: sibling
        run: |
          ref="$(jq -r '.siblings["eks-agent-platform"].ref' stack/upstream.json)"
          # Asserted before it becomes an output: actions/checkout reads an empty
          # ref as the default branch.
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FAIL  siblings.eks-agent-platform.ref read as '$ref', which is not a commit sha."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nanohype/eks-agent-platform
          path: .sibling/eks-agent-platform
          ref: ${{ steps.sibling.outputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/helm

      # Downloaded to a file and checked against the release's published digest
      # before it reaches PATH, as the kubeconform action is.
      - name: Install trivy
        env:
          TRIVY_VERSION: v0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          url="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          curl -sSfL --max-time 120 --retry 3 --retry-connrefused --retry-all-errors \
            -o trivy.tar.gz "$url"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f trivy.tar.gz trivy
          rm trivy.tar.gz
          trivy --version

      # The render, not the values files: the images a chart produces, not the
      # ones a values file names.
      - name: Render every slice at its pinned version
        env:
          KX_EKS_AGENT_PLATFORM_DIR: ${{ github.workspace }}/.sibling/eks-agent-platform
          KX_RENDER_OUT: ${{ runner.temp }}/render
        run: |
          pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/gate-requirements.txt
          ./scripts/render-check.sh

      # Teed to a file, which the tracking issue carries when the run is red.
      # check-images.py writes its state to the step's outputs.
      - name: Scan every image the pinned charts resolve to
        id: scan
        env:
          RENDER_DIR: ${{ runner.temp }}/render
          REPORT: ${{ runner.temp }}/scan-report.txt
        run: |
          set -o pipefail
          python3 scripts/check-images.py --cves "$RENDER_DIR" 2>&1 | tee "$REPORT"

      # One open issue carries every red run, found by its exact title, so a
      # closed one stays closed. A run that failed before the scan named a state
      # says so rather than inventing one.
      - name: Open or update the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.scan.outputs.state }}
          REPORT: ${{ runner.temp }}/scan-report.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="image-cves: the scheduled scan is red"
          body="${RUNNER_TEMP}/issue-body.md"
          {
            if [ -n "${STATE}" ]; then
              echo "The scan's state is **${STATE}**. Run: ${RUN_URL}"
            else
              echo "The run failed before the scan reported a state. Run: ${RUN_URL}"
            fi
            if [ -s "${REPORT}" ]; then
              echo
              echo '```'
              tail -n 80 "${REPORT}"
              echo '```'
            fi
          } >"${body}"
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "\"${title}\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | first | .number // empty")"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body-file "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${body}"
          fi
