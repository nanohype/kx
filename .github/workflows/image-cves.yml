name: image cves
# Scans the images kx's pinned charts resolve to, and fails on CRITICAL.
#
# kx pins its own chart versions in its own stack/*/*/install.sh and records
# them in its own stack/chart-provenance.json. Those pins are not derived from
# the catalog and can diverge from it, so no other repository can vouch for what
# they resolve to. `task up` pulls exactly these images into whichever
# environment runs it, which makes them a surface this repository owns once per
# adopter rather than once.
#
# Deliberately not part of ci.yml, for the reason chart-provenance and
# mirror-freshness give: whether a vulnerability was published against a pinned
# image overnight has a different answer every day and is not something a pull
# request caused. Asking it on the blocking path reddens changes that are not at
# fault. The half that IS a fact about the commit — whether every image
# reference is immutable, and every hand-pinned tag on its chart's release —
# runs there instead.
#
# In-cluster runtime scanning belongs to the trivy-operator addon and stays
# there. This is the other half: the images a pin resolves to, checked where the
# pin can actually be changed.
#
# A run ends in one of three states, each with its own exit status, and the job
# summary names it, so a red run says which one it is before anyone opens the
# log:
#
#   clean          Every image scanned; every CRITICAL is covered by an
#                  unexpired exception in stack/image-cve-exceptions.json.
#   findings       A CRITICAL nothing covers, or an exception that expired or
#                  matches nothing the scan reports. Read what upstream has
#                  published. Where the image publisher has rebuilt on a
#                  patched base, move the chart pin — noting that moving ahead
#                  of the catalog is a divergence mirror-check will report and
#                  that stack/upstream.json is where it gets declared. Where
#                  they have not, record a time-boxed exception with the reason.
#   could not run  The scanner or a registry could not answer for an image.
#                  That is about this run, not about the image, and it is never
#                  folded into the findings.
#
# A red run opens one tracking issue, or comments on it when it is already open,
# with the state and the scan's own report. A scheduled run has no pull request
# to go red on and nobody reviewing it, so without the issue a red week reaches
# no one. A person closes the issue once the pin has moved or the finding is
# excepted; the next red run opens a new one.

on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

# One run per ref. A push that lands on top of another leaves the first run
# grading a tree nobody is proposing any more, and its verdict arrives against
# the newer commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Are the pinned charts' images free of CRITICAL?
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write  # opens or comments on the tracking issue when the run is red
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nanohype/eks-agent-platform
          path: .sibling/eks-agent-platform
          persist-credentials: false

      - uses: ./.github/actions/helm

      # Downloaded to a file and checked before it is unpacked onto PATH and run,
      # the same way ci.yml treats kubeconform. Piping the response straight into
      # tar executes whatever arrives: a truncated transfer, a proxy error page or
      # a replaced asset all reach the next step as a binary. The digest is the one
      # the release publishes alongside the archive, so it catches corruption and
      # substitution of the asset; it does not attest the release itself, which
      # would need the upstream signing key.
      - name: Install trivy
        env:
          TRIVY_VERSION: v0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          url="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          curl -sSfL --max-time 120 --retry 3 --retry-connrefused --retry-all-errors \
            -o trivy.tar.gz "$url"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f trivy.tar.gz trivy
          rm trivy.tar.gz
          trivy --version

      # The scan needs the rendered stack, which is the same input the schema
      # gate takes: the images a chart actually produces, not the ones a values
      # file happens to name.
      - name: Render every slice at its pinned version
        env:
          KX_EKS_AGENT_PLATFORM_DIR: ${{ github.workspace }}/.sibling/eks-agent-platform
          KX_RENDER_OUT: ${{ runner.temp }}/render
        run: |
          pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/gate-requirements.txt
          ./scripts/render-check.sh

      # Kept as well as shown: when the run is red, the scan's own report is
      # what the tracking issue carries. check-images.py names its state in the
      # step's outputs itself.
      - name: Scan every image the pinned charts resolve to
        id: scan
        env:
          RENDER_DIR: ${{ runner.temp }}/render
          REPORT: ${{ runner.temp }}/scan-report.txt
        run: |
          set -o pipefail
          python3 scripts/check-images.py --cves "$RENDER_DIR" 2>&1 | tee "$REPORT"

      # One open issue carries every red run. Found by its exact title among the
      # open issues, so a closed one is left closed and the next red run starts
      # a new one. A run that failed before the scan reported a state says so,
      # rather than inventing one.
      - name: Open or update the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.scan.outputs.state }}
          REPORT: ${{ runner.temp }}/scan-report.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="image-cves: the scheduled scan is red"
          body="${RUNNER_TEMP}/issue-body.md"
          {
            if [ -n "${STATE}" ]; then
              echo "The scan's state is **${STATE}**. Run: ${RUN_URL}"
            else
              echo "The run failed before the scan reported a state. Run: ${RUN_URL}"
            fi
            if [ -s "${REPORT}" ]; then
              echo
              echo '```'
              tail -n 80 "${REPORT}"
              echo '```'
            fi
          } >"${body}"
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "\"${title}\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | first | .number // empty")"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body-file "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${body}"
          fi
