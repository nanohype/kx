name: mirror freshness
# Asks whether the eks-gitops catalog has moved past the pin in
# stack/upstream.json. Scheduled rather than in ci.yml, which compares against
# the catalog at the pinned ref (ADR 0011).
#
# A red run here means: `python3 scripts/mirror-check.py sync`, then
# ./scripts/render-check.sh, and ship whatever the values files need.

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

# One run per ref: a new run supersedes one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freshness:
    name: Is the catalog pin behind?
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the catalog at its default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nanohype/eks-gitops
          path: .sibling/eks-gitops
          persist-credentials: false

      - name: Compare against the current catalog
        env:
          EKS_GITOPS_DIR: ${{ github.workspace }}/.sibling/eks-gitops
        run: |
          pip install --quiet --timeout 60 --retries 3 --require-hashes -r .github/gate-requirements.txt
          python3 scripts/mirror-check.py freshness
