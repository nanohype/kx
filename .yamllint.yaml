extends: default

rules:
  line-length:
    max: 200
  # Flow mappings follow the org's prettier-style spacing: { replicas: 0 }.
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  # Values files column-align values for scanability (same idiom as aligned
  # `=` in the org's HCL) — don't fight deliberate alignment.
  colons:
    max-spaces-after: -1
  commas:
    max-spaces-after: -1
  truthy:
    check-keys: false
  document-start: disable
  comments:
    min-spaces-from-content: 1
