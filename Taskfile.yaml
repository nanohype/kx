version: '3'

# kx — top-level Taskfile
#
# Daily-driver entry points:
#   task up                          create cluster + install core stack
#   task down                        delete cluster
#   task reset                       down + up
#   task status                      nodes + pods + slice install status
#   task stack:<slice>:enable        install an opt-in slice
#   task stack:<slice>:disable       uninstall an opt-in slice
#   task stack:all:enable            install every opt-in slice (skips druid)
#   task port-forward:model-gateway  forward a Platform's model gateway
#   task test:kyverno                the Kyverno policy tests, no cluster needed
#
# The ArgoCD and Grafana UIs need no task — they are NodePorts published on
# loopback at localhost:30080 and localhost:30030.
#
# Every command here that reaches the cluster names kx's own kubeconfig,
# .kube/config at this directory, which holds the kind-kx context alone: the
# scripts by sourcing cluster/kubeconfig.sh, a direct kubectl, helm or kind
# command by carrying KUBECONFIG itself. Task's `env:` cannot do it, since it
# never overrides a KUBECONFIG the shell already exports.

includes:
  cluster:
    taskfile: ./cluster/Taskfile.yaml
    dir: ./cluster
  stack:
    taskfile: ./stack/Taskfile.yaml
    dir: ./stack

tasks:
  default:
    cmds:
      - task --list

  up:
    desc: Create cluster + install core stack
    cmds:
      - task: cluster:up
      - task: stack:core

  down:
    desc: Delete the cluster
    cmds:
      - task: cluster:down

  reset:
    desc: Delete + recreate cluster, then reinstall core stack
    cmds:
      - task: cluster:reset
      - task: stack:core

  status:
    desc: Cluster + stack status
    cmds:
      - task: cluster:status
      - task: stack:status

  # No port-forward task for the ArgoCD or Grafana UIs. Both Services are
  # NodePorts on ports cluster/kind-config.yaml publishes on 127.0.0.1, so both
  # are served as soon as their slice is up:
  #   http://localhost:30080   ArgoCD   (core)
  #   http://localhost:30030   Grafana  (observability slice)
  # A port-forward would bind an address the cluster already answers on.

  # A tenant's model gateway is a Service in that tenant's own namespace, not a
  # shared one — envoy-gateway runs in GatewayNamespace mode, so there is no
  # single address to forward. Name the Platform to reach its gateway:
  #   task port-forward:model-gateway PLATFORM=slack-knowledge-bot
  port-forward:model-gateway:
    desc: A Platform's model gateway on http://localhost:8080 (PLATFORM=<name>, requires ai-platform slice)
    cmds:
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' kubectl -n tenants-{{.PLATFORM}} port-forward svc/{{.PLATFORM}}-gateway 8080:8080
    requires:
      vars: [PLATFORM]

  # Clusterless: the bedrock-credentials policies against the fixtures in
  # tests/kyverno, the same suite the kyverno CI job runs. Needs the kyverno CLI
  # on PATH, at the release stack/security/kyverno/values.yaml names.
  test:kyverno:
    desc: Run the Kyverno policy tests (needs the kyverno CLI)
    cmds:
      - bash scripts/kyverno-test.sh

  # Clusterless: pytest over tests/ under coverage, the same run the test CI job
  # makes. Needs a python3 with .github/test-requirements.txt installed, and
  # kubeconform on PATH for the schema gate's self-test.
  test:python:
    desc: Run the Python tests under coverage (needs pytest, coverage and kubeconform)
    cmds:
      - bash scripts/python-test.sh

  argocd:initial-password:
    desc: Print the ArgoCD admin password
    cmds:
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' kubectl --request-timeout=60s -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d
      - echo
