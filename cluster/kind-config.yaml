# kx — kind cluster config
#
# 1 control plane + 2 workers — enough to feel scheduling, anti-affinity, PDBs.
# Default CNI/kube-proxy disabled because cilium installs with kubeProxyReplacement.
# Nodes stay NotReady until cilium is installed — `task up` does that in its stack:core step.
# Host ports 80/443 land on the control-plane node where ingress-nginx schedules.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kx

networking:
  disableDefaultCNI: true
  kubeProxyMode: none
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"

# Tell containerd where to look for per-registry hosts.toml files. The actual mirror
# config for the local registry is written by cluster/registry.sh into /etc/containerd/certs.d/
# on each node, per the modern kind+registry pattern (containerd 1.5+; required for 2.x where
# the older registry.mirrors schema was removed).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"

# Pin the node image so the K8s version doesn't float with the kind binary. This tracks
# the org EKS target (Kubernetes 1.36); the digest guarantees the exact image built for
# kind v0.32.0 (the tag alone can be re-pushed, the digest can't). Bump both together when
# the EKS target moves.
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    # ingress-ready is consumed by ingress-nginx's nodeSelector so the controller
    # schedules on the control-plane node where hostPort 80/443 lands.
    labels:
      workload: system
      ingress-ready: "true"
    # listenAddress is 0.0.0.0 by default, which publishes each of these on every
    # interface the workstation has — so on shared wifi the cluster's ingress,
    # Grafana and the ArgoCD UI are reachable by anyone on the network. Nothing
    # here is authenticated well enough for that: MinIO ships minioadmin/minioadmin
    # and Grafana ships admin, both deliberately, because this is a local
    # workspace. Those defaults are only defensible while the ports are loopback,
    # so the binding is what makes the credentials safe rather than the other way
    # round. Bind explicitly; do not rely on the default.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30030
        hostPort: 30030
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "127.0.0.1"
        protocol: TCP

  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    # `node-role.kubernetes.io/worker` would be the conventional label but kubelet
    # refuses to self-apply labels in the `kubernetes.io/` namespace beyond a small
    # allowlist — that prefix is for server-side application post-registration.
    # If you want the role label, run after `task up`:
    #   kubectl label node kx-worker  node-role.kubernetes.io/worker=true
    #   kubectl label node kx-worker2 node-role.kubernetes.io/worker=true
    labels:
      workload: general

  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    # `node-role.kubernetes.io/worker` would be the conventional label but kubelet
    # refuses to self-apply labels in the `kubernetes.io/` namespace beyond a small
    # allowlist — that prefix is for server-side application post-registration.
    # If you want the role label, run after `task up`:
    #   kubectl label node kx-worker  node-role.kubernetes.io/worker=true
    #   kubectl label node kx-worker2 node-role.kubernetes.io/worker=true
    labels:
      workload: general
