# pytest over tests/: the unit tests of the helpers kx's installers run, and
# the gates' own self-tests. scripts/python-test.sh runs it under coverage and
# holds the result to its floors.
[pytest]
# An older pytest would read this file and run with its own defaults for every
# option it predates; refusing is better than a run nobody configured.
minversion = 9.2
testpaths = tests
# importlib rather than the default prepend: nothing here is a package, and
# prepending each test directory to sys.path lets two test modules that share a
# basename shadow each other.
addopts = --import-mode=importlib
# Unknown options, unregistered markers, an xfail that passes and duplicate
# parametrization ids are errors rather than warnings.
strict = true
