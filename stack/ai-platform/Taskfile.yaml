version: '3'

# ai-platform slice — agent plane mirroring eks-agent-platform
# Envoy AI Gateway (CRDs, then the Gateway API control plane, then the AI
# layer) plus the operator.
#
# Order is load-bearing. Both CRD addons go in first: the AI layer's because its
# chart does not ship them, Envoy Gateway's because envoy-gateway installs with
# its CRD bundle off (that bundle also carries Gateway API, which core owns). A
# controller installed ahead of its CRDs watches kinds the API server has never
# heard of and reconciles nothing while reporting healthy. envoy-gateway
# precedes envoy-ai-gateway because the AI layer registers a webhook against
# that control plane and reads its GatewayClass. The operator is last: it
# reconciles ModelGateway CRs into Gateway + AIGatewayRoute resources, which
# need all of it in place.
#
# The operator is built from the sibling eks-agent-platform checkout (image
# isn't published) — override the path with KX_EKS_AGENT_PLATFORM_DIR if your
# repos don't sit side by side.

tasks:
  enable:
    desc: Install ai-platform slice (Envoy AI Gateway + operator)
    cmds:
      - bash {{.TASKFILE_DIR}}/envoy-ai-gateway-crds/install.sh
      - bash {{.TASKFILE_DIR}}/envoy-gateway-crds/install.sh
      - bash {{.TASKFILE_DIR}}/envoy-gateway/install.sh
      - bash {{.TASKFILE_DIR}}/envoy-ai-gateway/install.sh
      - bash {{.TASKFILE_DIR}}/operator/install.sh

  credentials:
    desc: Give local gateways an AWS identity (needs the security slice for Kyverno)
    cmds:
      - bash {{.TASKFILE_DIR}}/bedrock-credentials/install.sh

  credentials:verify:
    desc: Assert every gateway data plane carries the local Bedrock credentials
    cmds:
      - bash {{.TASKFILE_DIR}}/bedrock-credentials/verify.sh

  # The credential outlives the slice unless something withdraws it, and the
  # copies outlive the policy unless something names them: Kyverno leaves a
  # cloned Secret in place when the GeneratingPolicy that cloned it is deleted,
  # and puts back one deleted while the policy lives. uninstall.sh deletes the
  # policies first and then the copies by name.
  credentials:disable:
    desc: Withdraw the local Bedrock credentials and the rights they needed
    cmds:
      - bash {{.TASKFILE_DIR}}/bedrock-credentials/uninstall.sh

  # The only check here that sends traffic. Everything else — status phases,
  # the credentials verify, the render gate — reads a resource, and a gateway
  # that answers nothing looks identical to one that works in all of them.
  #
  #   task stack:ai-platform:conformance PLATFORM=blank
  #   task stack:ai-platform:conformance PLATFORM=blank ROUTE=embeddings
  #
  # Needs the credentials slice: the gateway signs the upstream Bedrock call,
  # so without an identity every probe fails at the upstream rather than at
  # anything this workspace controls.
  conformance:
    desc: Probe a Platform's gateway with real traffic (PLATFORM=<name>, ROUTE=primary)
    cmds:
      - bash {{.TASKFILE_DIR}}/conformance/run.sh
    requires:
      vars: [PLATFORM]

  disable:
    desc: Uninstall ai-platform slice
    cmds:
      # Credentials first, and unconditionally: this task is the slice's only
      # teardown entry point, and the ClusterRole, GeneratingPolicy and
      # MutatingPolicy the optional credentials task creates are cluster-scoped,
      # so no namespace delete below removes them.
      - task: 'credentials:disable'
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' helm uninstall -n eks-agent-platform eks-agent-platform-operator || true
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' kubectl --request-timeout=60s --timeout=5m delete ns eks-agent-platform --ignore-not-found
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' helm uninstall -n envoy-gateway-system envoy-ai-gateway      || true
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' helm uninstall -n envoy-gateway-system envoy-gateway         || true
      # After the controller, not before: deleting a CRD deletes every resource
      # of its kind, so the definitions outlive what reconciles them. No helm
      # release to uninstall — install.sh applies these without one, so
      # uninstall.sh deletes them by group. The `|| true` above keeps disable
      # re-runnable, which also lets it carry on past a failed uninstall, so
      # uninstall.sh refuses while the envoy-gateway release or Deployment is
      # still there rather than relying on this order.
      - bash {{.TASKFILE_DIR}}/envoy-gateway-crds/uninstall.sh
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' helm uninstall -n envoy-gateway-system envoy-ai-gateway-crds || true
      # Cluster-scoped, so no namespace delete reaches it. Applied by
      # envoy-ai-gateway/install.sh, which no helm release owns.
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' kubectl --request-timeout=60s --timeout=5m delete gatewayclass envoy-ai-gateway --ignore-not-found
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' kubectl --request-timeout=60s --timeout=5m delete ns envoy-gateway-system --ignore-not-found
