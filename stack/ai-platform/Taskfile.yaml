version: '3'

# ai-platform slice — agent plane mirroring eks-agent-platform
# Envoy AI Gateway (CRDs, then the Gateway API control plane, then the AI
# layer) plus the operator.
#
# Order is load-bearing. The AI layer's CRDs go in first because its chart does
# not ship them, so a controller installed ahead of them watches kinds the API
# server has never heard of and reconciles nothing while reporting healthy.
# envoy-gateway precedes envoy-ai-gateway because the AI layer registers a
# webhook against that control plane and reads its GatewayClass. The operator
# is last: it reconciles ModelGateway CRs into Gateway + AIGatewayRoute
# resources, which need all three in place.
#
# The operator is built from the sibling eks-agent-platform checkout (image
# isn't published) — override the path with KX_EKS_AGENT_PLATFORM_DIR if your
# repos don't sit side by side.

tasks:
  enable:
    desc: Install ai-platform slice (Envoy AI Gateway + operator)
    cmds:
      - bash {{.TASKFILE_DIR}}/envoy-ai-gateway-crds/install.sh
      - bash {{.TASKFILE_DIR}}/envoy-gateway/install.sh
      - bash {{.TASKFILE_DIR}}/envoy-ai-gateway/install.sh
      - bash {{.TASKFILE_DIR}}/operator/install.sh

  credentials:
    desc: Give local gateways an AWS identity (needs the security slice for Kyverno)
    cmds:
      - bash {{.TASKFILE_DIR}}/bedrock-credentials/install.sh

  credentials:verify:
    desc: Assert every gateway data plane carries the local Bedrock credentials
    cmds:
      - bash {{.TASKFILE_DIR}}/bedrock-credentials/verify.sh

  # The only check here that sends traffic. Everything else — status phases,
  # the credentials verify, the render gate — reads a resource, and a gateway
  # that answers nothing looks identical to one that works in all of them.
  #
  #   task stack:ai-platform:conformance PLATFORM=blank
  #   task stack:ai-platform:conformance PLATFORM=blank ROUTE=embeddings
  #
  # Needs the credentials slice: the gateway signs the upstream Bedrock call,
  # so without an identity every probe fails at the upstream rather than at
  # anything this workspace controls.
  conformance:
    desc: Probe a Platform's gateway with real traffic (PLATFORM=<name>, ROUTE=primary)
    cmds:
      - bash {{.TASKFILE_DIR}}/conformance/run.sh
    requires:
      vars: [PLATFORM]

  disable:
    desc: Uninstall ai-platform slice
    cmds:
      - helm uninstall -n eks-agent-platform eks-agent-platform-operator || true
      - kubectl delete ns eks-agent-platform --ignore-not-found
      - helm uninstall -n envoy-gateway-system envoy-ai-gateway      || true
      - helm uninstall -n envoy-gateway-system envoy-gateway         || true
      - helm uninstall -n envoy-gateway-system envoy-ai-gateway-crds || true
      - kubectl delete ns envoy-gateway-system --ignore-not-found
