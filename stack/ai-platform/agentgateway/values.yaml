# agentgateway for kx
# Production: fronts AWS Bedrock with Guardrails, behind ALB, 3-20 replicas.
# Local: single replica, ClusterIP, no Bedrock-specific config — Route CRs (agentgateway.dev/v1alpha1)
# define what gets fronted (Anthropic, OpenAI, local mock, future LiteLLM, etc.).

controller:
  replicaCount: 1
  logLevel: info
  service:
    type: ClusterIP

resources:
  requests:
    cpu: 50m
    memory: 128Mi

podAnnotations:
  prometheus.io/scrape: "true"
