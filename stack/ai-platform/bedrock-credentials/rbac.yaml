# Kyverno holds no permission on Secrets out of the box, and it refuses a
# generate rule it could not execute — the policy is rejected at admission
# rather than accepted and silently inert, which is the right call and the
# reason this file exists.
#
# Granted by aggregation rather than by binding a role directly to Kyverno's
# ServiceAccounts: the chart owns those bindings, so a direct binding would be
# a second owner of the same subject and would drift on upgrade. Kyverno's own
# ClusterRoles aggregate anything carrying these labels, which is the extension
# point it publishes.
#
# Both controllers need it. The admission controller evaluates the rule when a
# namespace is created; the background controller owns synchronize, which is
# what propagates a rotated Secret and cleans up when the source is deleted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:bedrock-credentials
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  # Scoped to Secrets rather than the whole core group. Kyverno is a
  # cluster-wide admission controller; a broad grant here is a broad grant to
  # everything it reconciles, and this policy needs exactly one kind.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
