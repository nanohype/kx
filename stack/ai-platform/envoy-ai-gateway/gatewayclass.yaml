# The GatewayClass every ModelGateway's Gateway names.
#
# The operator writes each Gateway with `gatewayClassName: envoy-ai-gateway`.
# Nothing else creates that GatewayClass — neither the gateway-helm chart nor
# the ai-gateway-helm chart ships one, because a GatewayClass binds a
# controller to a name and upstream leaves that naming to the installer.
#
# A Gateway naming a GatewayClass that does not exist is simply never picked
# up: no controller claims it, so it stays unaccepted, no Envoy is rendered,
# and the Service the ModelGateway publishes as its endpoint has no backend.
# Nothing reports an error — there is no controller watching to report one.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-ai-gateway
spec:
  # Envoy Gateway's controller. The AI layer does not run a GatewayClass
  # controller of its own — it extends this one through the extensionManager
  # hooks configured in ../envoy-gateway/values.yaml.
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
