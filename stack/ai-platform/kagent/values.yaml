# kagent for kx
# Differences from eks-agent-platform production:
# - Single-replica controller + UI (laptop)
# - kagent-tools and kmcp sub-charts DISABLED by default — opt in per-project when an agent needs them
# - Bundled postgres OK (no external DB locally); pgvector off until a project needs long-term memory
# - No ALB ingress; UI reachable via `task port-forward:kagent-ui`

controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

ui:
  replicas: 1
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

# Bundled Postgres — fine for local; not for prod.
database:
  postgres:
    vectorEnabled: false
    bundled:
      enabled: true

# Provider default — kagent points at openAI by default. Override per-project (or via env)
# to route through agentgateway, Anthropic, or a local LiteLLM if added later.
providers:
  default: openAI

otel:
  tracing:
    enabled: false

# Heavy sub-charts off by default. Re-enable per-project:
#   helm upgrade kagent ... --set kagent-tools.enabled=true --set kmcp.enabled=true
kagent-tools:
  enabled: false

kmcp:
  enabled: false

# kagent ships ~10 default Agent CRs (k8s, helm, istio, cilium-*, argo-rollouts, promql,
# observability, kgateway). Each spins up its own Deployment that needs LLM API credentials.
# Without keys they sit in CreateContainerConfigError. Disable them by default — projects
# build their own AgentFleets against the controller and CRDs.
k8s-agent: { enabled: false }
helm-agent: { enabled: false }
istio-agent: { enabled: false }
kgateway-agent: { enabled: false }
promql-agent: { enabled: false }
observability-agent: { enabled: false }
argo-rollouts-agent: { enabled: false }
cilium-policy-agent: { enabled: false }
cilium-manager-agent: { enabled: false }
cilium-debug-agent: { enabled: false }
