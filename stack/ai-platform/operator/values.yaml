# eks-agent-platform operator — kx local profile (deltas from chart defaults).
# Image is built + kind-loaded by install.sh (tag dev, never pushed).
image:
  tag: dev
  pullPolicy: IfNotPresent

# No AWS locally — skip the IRSA/KMS/SSM reconcile. Platform CRs still produce
# the full k8s tenant boundary (namespace, quota, netpol, SA, AppProject).
extraArgs:
  - --disable-aws

# kx core runs cert-manager; provision a self-signed ClusterIssuer for the
# webhook cert rather than expecting a production issuer.
webhooks:
  certManager:
    installSelfSignedIssuer: true

# kx uses cilium — a vanilla NetworkPolicy can't allow kube-apiserver egress
# under it, so use the CiliumNetworkPolicy engine.
networkPolicy:
  enabled: true
  engine: cilium

# The eval runtime ships an Argo WorkflowTemplate, so the chart cannot render
# without the Argo Workflows CRDs. Those belong to the argo-platform slice, and
# slices install independently — so enabling it here would make this slice fail
# on any cluster that has not enabled that one.
#
# Failing is the mild part. `helm upgrade` aborts before touching the
# Deployment, so the freshly built image is loaded onto the nodes and never
# rolled out: the slice reports an error, and the operator keeps serving
# whatever code it was already running. Every later verification then reads a
# cluster the source no longer describes.
#
# Turn it on once argo-platform is enabled, if you want to exercise eval
# gating locally: `task stack:argo-platform:enable`, then reinstall this slice
# with --set evalRuntime.enabled=true.
evalRuntime:
  enabled: false
