version: '3'

tasks:
  enable:
    desc: Install argo-platform slice (events, rollouts, workflows)
    cmds:
      - bash {{.TASKFILE_DIR}}/argo-events/install.sh
      - bash {{.TASKFILE_DIR}}/argo-rollouts/install.sh
      - bash {{.TASKFILE_DIR}}/argo-workflows/install.sh

  disable:
    desc: Uninstall argo-platform slice
    cmds:
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' helm uninstall -n argo argo-workflows || true
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' helm uninstall -n argo argo-rollouts  || true
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' helm uninstall -n argo argo-events    || true
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' kubectl --request-timeout=60s --timeout=5m delete ns argo --ignore-not-found
