# argo-workflows — workflow / CI-style execution as DAGs of pods.

# The requirement: this slice installs the argoproj.io CRDs from the chart on
# disk, and reaches the network for none of them.
#
# The chart's default (`crds.full: true`) does the opposite. It ships no CRD
# manifests and instead renders a Job that applies each one from
# raw.githubusercontent.com, so bringing the cluster up depends on live GitHub
# egress. `crds.install: false` ships none either, which is what eks-gitops
# uses because a separate Application installs them at an earlier sync wave —
# kx has no ArgoCD and no waves, so that setting would leave the cluster with no
# argoproj.io CRDs at all.
#
# `full: false` is the only mode that ships the manifests and fetches nothing.
# To check a chart bump has not changed that, render it and confirm the CRDs are
# present and no raw.githubusercontent.com URL is:
#
#   helm template argo-workflows argo/argo-workflows --version <pin> \
#     --values stack/argo-platform/argo-workflows/values.yaml \
#     | grep -c 'kind: CustomResourceDefinition'   # must be non-zero
#   helm template ... | grep raw.githubusercontent.com   # must match nothing
crds:
  full: false
  install: true

controller:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
  workflowNamespaces:
    - argo

server:
  enabled: true
  replicas: 1
  authModes:
    - server   # no SSO locally; UI open
  service:
    type: ClusterIP

# Use the cluster-default storageClass for artifact PVCs if needed.
artifactRepository:
  archiveLogs: false
