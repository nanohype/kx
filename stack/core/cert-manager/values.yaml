# cert-manager for kx
#
# Local-only deltas:
# - single replica for the controller, webhook, cainjector
# - CRDs installed by the chart
# - no PDBs (single-replica makes them moot)
# - no CriticalAddonsOnly tolerations (no taints on kx nodes)

crds:
  enabled: true

replicaCount: 1

resources:
  requests:
    cpu: 25m
    memory: 64Mi

webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

cainjector:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

podDisruptionBudget:
  enabled: false
