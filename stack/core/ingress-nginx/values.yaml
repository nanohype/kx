# ingress-nginx for kx
#
# Production-side: aws-load-balancer-controller (NLB/ALB). Not portable to a laptop.
# Here: ingress-nginx scheduled onto the control-plane node which has ingress-ready=true
# and hostPort 80/443 mapped to the host. Services exposed at http://localhost / https://localhost.

controller:
  kind: DaemonSet
  hostPort:
    enabled: true
  service:
    type: NodePort
  nodeSelector:
    ingress-ready: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  publishService:
    enabled: false
  watchIngressWithoutClass: true
  extraArgs:
    enable-ssl-passthrough: "true"
  metrics:
    enabled: true
    # On by default. prometheus-operator-crds is a core addon, so the
    # ServiceMonitor CRD exists on every kx cluster and this applies cleanly
    # whether or not the observability slice is enabled — it is inert without
    # a Prometheus to read it, and picked up the moment one arrives, because
    # kube-prometheus-stack sets serviceMonitorSelectorNilUsesHelmValues:
    # false. Leaving it off made the scrape a step the user had to know to
    # take, which is the opt-in this workspace's always-complete rule exists
    # to avoid.
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
