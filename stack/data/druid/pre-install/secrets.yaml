# Admin + system credentials Druid expects.
# Production: external-secrets pulls these from AWS Secrets Manager (chart's externalsecret.yaml).
# Local: provide them directly. Names match `{include "druid.name" .}-druid-{kind}` →
# with hostedId=kx, release=ds → kx-ds-druid-admin / kx-ds-druid-system.
# Passwords are intentionally trivial — this is a local cluster.

apiVersion: v1
kind: Secret
metadata:
  name: kx-ds-druid-admin
  namespace: druid
type: Opaque
stringData:
  username: admin
  password: admin
---
apiVersion: v1
kind: Secret
metadata:
  name: kx-ds-druid-system
  namespace: druid
type: Opaque
stringData:
  username: druid_system
  password: druid_system
