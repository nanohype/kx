# minio for kx
# S3-compatible object storage. Used as the velero backend, and available to any project that
# needs S3 semantics locally (replaces what S3 buckets do in eks-gitops).
#
# Default credentials: minioadmin / minioadmin. Defensible only because nothing
# publishes this service: it has no ingress and no host port, so the console is
# reachable only through a port-forward the operator starts. Publish it and
# these become a credential on the local network — change them in the same edit,
# not after it.
# Console: kubectl port-forward -n minio svc/minio-console 9001:9001

mode: standalone

replicas: 1

persistence:
  enabled: false   # kx is ephemeral; flip on with a PVC if you want survival across reset

resources:
  requests:
    cpu: 50m
    memory: 256Mi

rootUser: minioadmin
rootPassword: minioadmin

# Pre-create the bucket velero expects.
buckets:
  - name: velero
    policy: none
    purge: false
