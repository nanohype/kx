# grafana-operator for kx
# Lets a project author Grafana Dashboard / Datasource CRs and have the operator
# reconcile them into a Grafana instance.
#
# The operator reconciles into whatever a `Grafana` CR names, and this slice
# installs no such CR — a project supplies one pointing at the instance it wants,
# which for the kube-prometheus-stack Grafana means an `external` block carrying
# its URL and an admin credential. Until one exists the operator runs and
# reconciles nothing, which is the correct idle state and not a fault to debug.
#
# Prometheus, Loki and Tempo are wired as datasources by the kube-prometheus-stack
# slice directly, so nothing here is needed to query the three signals.

replicas: 1

resources:
  requests:
    cpu: 25m
    memory: 64Mi

# Watch all namespaces so per-project Dashboard CRs work.
namespaceScope: false
