# loki for kx — single-binary mode with filesystem storage
# Production eks-gitops uses S3 (gp3-backed); locally storage stays in-pod.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  # No extraVolumes/extraVolumeMounts here, deliberately. With persistence off
  # this chart mounts its own emptyDir at /var/loki when persistence is off,
  # which is what a hand-rolled `data` volume would otherwise supply — without
  # it loki mkdir's the storage and ruler dirs onto a read-only rootfs and
  # crashes.
  #
  # Adding one back is worse than redundant: two volumeMounts on one mountPath in
  # a single container is rejected outright, so the pod never starts. `helm
  # template` renders that happily and exits 0, which is why the render gate now
  # pipes its output through scripts/check-rendered-mounts.py — exit status alone
  # cannot see it.
  persistence:
    enabled: false   # kx is ephemeral by design

# Disable the chart's bundled gateway/loki-canary/test components.
gateway:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Run nothing in the scalable/distributed modes.
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomCompactor: { replicas: 0 }
bloomGateway: { replicas: 0 }

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
