version: '3'

tasks:
  enable:
    desc: Install secrets slice
    cmds:
      - bash {{.TASKFILE_DIR}}/external-secrets/install.sh

  disable:
    desc: Uninstall secrets slice
    cmds:
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' helm uninstall -n external-secrets external-secrets || true
      - KUBECONFIG='{{.ROOT_DIR}}/.kube/config' kubectl --request-timeout=60s --timeout=5m delete ns external-secrets --ignore-not-found
