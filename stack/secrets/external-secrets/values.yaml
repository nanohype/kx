# external-secrets for kx
# Same chart as eks-gitops, but locally projects use the `kubernetes` or `fake` SecretStore
# providers instead of AWS Secrets Manager. The CRDs (ExternalSecret, ClusterSecretStore) behave identically —
# that's the whole point of using the same chart locally.

replicaCount: 1

resources:
  requests:
    cpu: 25m
    memory: 64Mi

installCRDs: true

webhook:
  replicaCount: 1

certController:
  replicaCount: 1
