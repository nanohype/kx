# kyverno for kx
# Admission policy engine. eks-gitops has a full policy library — kx installs the engine and
# leaves policy authoring to per-project needs.

admissionController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

backgroundController:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

cleanupController:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

reportsController:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

# Two chart hooks run ghcr.io/kyverno/readiness-checker, and the chart falls
# back to a different tag for each. The webhook cleanup hook, the pre-delete
# Jobs `helm uninstall` runs, takes the chart's appVersion. The test hook, the
# Pods `helm test` starts, takes `latest`: a floating tag, a different program
# on the next pull with nothing recording which one ran. The chart's values file
# documents `latest` for both, so which default the cleanup hook gets depends on
# which of the two a later chart version honours.
#
# Both are pinned to the chart's appVersion, the release every Kyverno
# controller image renders at, as eks-gitops pins the same two keys. They move
# with the chart pin in install.sh: scripts/check-images.py fails the render
# gate when these tags name a different release from the admission controller
# image.
webhooksCleanup:
  image:
    tag: v1.19.2

test:
  image:
    tag: v1.19.2
