# envoy carried a reference from before; the sidecar gains one and envoy's is
# left as it was. The policy only ever adds.
apiVersion: v1
kind: Pod
metadata:
  name: gw-envoy-only
  namespace: tenants-alpha
  labels:
    app.kubernetes.io/managed-by: envoy-gateway
    app.kubernetes.io/component: proxy
spec:
  initContainers:
    - name: ai-gateway-extproc
      image: docker.io/envoyproxy/ai-gateway-extproc:v0.4.0
      restartPolicy: Always
      envFrom:
        - secretRef:
            name: kx-bedrock-credentials
            optional: true
  containers:
    - name: envoy
      image: docker.io/envoyproxy/envoy:distroless-v1.36.0
      envFrom:
        - secretRef:
            name: kx-bedrock-credentials
            optional: true
