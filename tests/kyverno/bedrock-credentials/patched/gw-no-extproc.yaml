# No sidecar: nothing is added, to envoy or anywhere else, and no
# initContainers list appears.
apiVersion: v1
kind: Pod
metadata:
  name: gw-no-extproc
  namespace: tenants-alpha
  labels:
    app.kubernetes.io/managed-by: envoy-gateway
    app.kubernetes.io/component: proxy
spec:
  containers:
    - name: envoy
      image: docker.io/envoyproxy/envoy:distroless-v1.36.0
