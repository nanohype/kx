# The sidecar is the second init container: it gets the reference at the index
# its name was found at, and every other container, envoy included, is left as
# it was.
apiVersion: v1
kind: Pod
metadata:
  name: gw-reordered
  namespace: tenants-alpha
  labels:
    app.kubernetes.io/managed-by: envoy-gateway
    app.kubernetes.io/component: proxy
spec:
  initContainers:
    - name: wait-for-xds
      image: docker.io/library/busybox:1.37
    - name: ai-gateway-extproc
      image: docker.io/envoyproxy/ai-gateway-extproc:v0.4.0
      restartPolicy: Always
      envFrom:
        - secretRef:
            name: kx-bedrock-credentials
            optional: true
  containers:
    - name: shutdown-manager
      image: docker.io/envoyproxy/gateway:v1.6.0
    - name: envoy
      image: docker.io/envoyproxy/envoy:distroless-v1.36.0
