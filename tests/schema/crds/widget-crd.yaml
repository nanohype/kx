# A synthetic CRD so the self-test is hermetic: it proves the gate's behaviour
# without rendering the whole stack, and without pinning the test to whatever
# CRDs the catalog happens to ship this week.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.kx.test
spec:
  group: kx.test
  names:
    kind: Widget
    plural: widgets
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [size]
              properties:
                size: { type: integer }
